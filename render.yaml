services:
  - type: web
    name: campus-swap-api
    runtime: node
    plan: free
    rootDir: campus-swap
    # Scoped so the deploy never installs the Expo app's dependencies.
    buildCommand: npm ci --include-workspace-root -w @campus-swap/shared -w @campus-swap/api && npm run build:api
    startCommand: npm run start --workspace @campus-swap/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; main.ts already reads it.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # Generate each with: openssl rand -base64 48
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SIGN_IN_CODE_PEPPER
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      # Production refuses to boot with MAIL_DRY_RUN=true, so a Resend key is
      # required before real sign-in codes can be sent.
      - key: MAIL_DRY_RUN
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CORS_ORIGINS
        sync: false

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Swap · All screens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&amp;family=DM+Sans:wght@400;500;700&amp;family=Pinyon+Script&amp;display=swap">
<style>
  :root { color-scheme: dark; --scale: 1; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #201A1A;
    color: #F8F3EC;
    font-family: 'DM Sans', system-ui, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 18px 24px;
    background: rgba(32, 26, 26, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #3A2F2F;
  }
  h1 {
    margin: 0;
    font-family: 'Bodoni Moda', Georgia, serif;
    font-size: 22px;
    font-weight: 500;
  }
  header p { margin: 0; font-size: 13px; color: #A2918D; margin-right: auto; }
  .zoom { display: flex; gap: 6px; }
  .zoom button {
    padding: 6px 12px;
    min-height: 32px;
    border: 1px solid #4A3B3B;
    border-radius: 16px;
    background: transparent;
    color: #E6DBD3;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .zoom button[aria-pressed='true'] { background: #9B1C1F; border-color: #9B1C1F; color: #fff; }
  .rail {
    display: flex;
    gap: 22px;
    padding: 24px;
    overflow-x: auto;
    align-items: flex-start;
  }
  /* Scale the frames down so several fit a narrow side panel at once. */
  figure {
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
    width: calc(390px * var(--scale));
  }
  figcaption {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #A2918D;
  }
  figcaption b {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 10px;
    background: #9B1C1F;
    color: #fff;
    font-size: 11px;
  }
  /* 844px frame + the 24px top/bottom padding each screen sets on its own body. */
  .phone {
    width: 390px;
    height: 896px;
    border: 0;
    border-radius: 18px;
    background: #2A2222;
    box-shadow: 0 22px 50px rgba(0, 0, 0, 0.45);
    transform: scale(var(--scale));
    transform-origin: top left;
  }
  .frame { height: calc(896px * var(--scale)); }
  a { color: #E8C07A; }
</style>
</head>
<body>
<header>
  <h1>Campus Swap</h1>
  <p>Six design screens, live with their animations.</p>
  <div class="zoom" role="group" aria-label="Preview size">
    <button type="button" data-scale="1">100%</button>
    <button type="button" data-scale="0.55">55%</button>
    <button type="button" data-scale="0.32">Fit all</button>
  </div>
</header>
<div class="rail">
  <figure><figcaption><b>1</b> Sign in</figcaption><div class="frame"><iframe class="phone" src="screens/01-sign-in.html" title="Sign in"></iframe></div></figure>
  <figure><figcaption><b>2</b> Home feed</figcaption><div class="frame"><iframe class="phone" src="screens/02-home-feed.html" title="Home feed"></iframe></div></figure>
  <figure><figcaption><b>3</b> Listing detail</figcaption><div class="frame"><iframe class="phone" src="screens/03-listing-detail.html" title="Listing detail"></iframe></div></figure>
  <figure><figcaption><b>4</b> Create listing</figcaption><div class="frame"><iframe class="phone" src="screens/04-create-listing.html" title="Create listing"></iframe></div></figure>
  <figure><figcaption><b>5</b> Chat + meetup</figcaption><div class="frame"><iframe class="phone" src="screens/05-chat-meetup.html" title="Chat and meetup"></iframe></div></figure>
  <figure><figcaption><b>6</b> Profile</figcaption><div class="frame"><iframe class="phone" src="screens/06-profile.html" title="Profile"></iframe></div></figure>
</div>
<script>
  const buttons = [...document.querySelectorAll('.zoom button')];

  function apply(scale) {
    document.documentElement.style.setProperty('--scale', String(scale));
    for (const button of buttons) {
      button.setAttribute('aria-pressed', String(Number(button.dataset.scale) === scale));
    }
    localStorage.setItem('campus-swap-preview-scale', String(scale));
  }

  for (const button of buttons) {
    button.addEventListener('click', () => apply(Number(button.dataset.scale)));
  }

  // Default to whatever fits the panel the preview was opened in.
  const saved = Number(localStorage.getItem('campus-swap-preview-scale'));
  apply(saved || (window.innerWidth < 900 ? 0.55 : 1));
</script>
</body>
</html>
